name: Compilar y Desplegar Medgon en Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Compilar Vite y subir a /app
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Obtener código del commit
        uses: actions/checkout@v5

      - name: 2. Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 3. Instalar dependencias y compilar web (Vite)
        run: |
          npm install
          npm run build

      - name: 4. Subir carpeta compilada (dist/) a Hostinger por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /app/
